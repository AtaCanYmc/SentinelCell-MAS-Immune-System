name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  # -----------------------------------------------------------------------
  # Release Please: Conventional Commits'e göre Release PR açar / merge
  # edilince GitHub Release + Git tag oluşturur ve pyproject.toml'u günceller
  # -----------------------------------------------------------------------
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name:        ${{ steps.release.outputs.tag_name }}
      version:         ${{ steps.release.outputs.version }}
      major:           ${{ steps.release.outputs.major }}
      minor:           ${{ steps.release.outputs.minor }}
      patch:           ${{ steps.release.outputs.patch }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Config ve manifest dosyalarını repo kökünde ara
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # -----------------------------------------------------------------------
  # Release oluşturulduktan sonra özet bilgi bas
  # -----------------------------------------------------------------------
  post-release-summary:
    name: Post-Release Summary
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Print release info
        run: |
          echo "🚀 New release created!"
          echo "  Tag     : ${{ needs.release-please.outputs.tag_name }}"
          echo "  Version : ${{ needs.release-please.outputs.version }}"
          echo ""
          echo "Docker publish workflow will now trigger on tag ${{ needs.release-please.outputs.tag_name }}."
